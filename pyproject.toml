[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name="sinette"
dynamic = ["version"]
readme = "README.md"
description="Sinetter receiver for Python"
requires-python = ">=3.8"

dependencies = [
    "sacn>=1.11.0",
]
authors = [
  {name = "vanous", email = "noreply@nodomain.com"},
]
maintainers = [
  {name = "vanous", email = "noreply@nodomain.com"},
]
keywords = ["Sinette", "DMX"]
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[tool.setuptools]
packages = ["sinette"]

[tool.setuptools.dynamic]
version = {attr = "sinette.__version__"}


[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.3.4",
    "ruff>=0.16.4",
]

[tool.uv.extra-build-dependencies]
sinette = ["sacn"]

[project.urls]
Repository = "https://github.com/open-stage/sinette.git"
Changelog = "https://github.com/open-stage/sinette/blob/master/CHANGELOG.md"
